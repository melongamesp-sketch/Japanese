<title>N3 2022/12　読解等</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-2:#EFF4FC;
    --paper-3:#DCE7F6;
    --ink:#20242B;
    --ink-soft:#5B6472;
    --indigo:#2F6FE0;
    --indigo-deep:#1E4FB0;
    --vermillion:#F2703D;
    --line:#E3E9F3;
    --shadow: 0 1px 2px rgba(32,36,43,.05), 0 6px 18px rgba(32,36,43,.06);
    --q-bg:#F5ECDA;
    --q-border:#E6D6B8;
    --mondai-ink:#4A3728;
    --page-bg:#7A5940;
    --light-ink:#F3E9D6;
    --light-ink-soft:#D8C3A0;
    --light-accent:#9FC4FF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14181F;
      --paper-2:#1C222C;
      --paper-3:#2A3242;
      --ink:#E7EBF3;
      --ink-soft:#9AA5B8;
      --indigo:#6FA0F5;
      --indigo-deep:#9CC0FF;
      --vermillion:#FF8A5B;
      --line:#2E3646;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --q-bg:#2A2115;
      --q-border:#4A3B26;
      --mondai-ink:#E8D5B4;
      --page-bg:#35261A;
      --light-ink:#F5ECDA;
      --light-ink-soft:#C9B08A;
      --light-accent:#9CC0FF;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14181F;
    --paper-2:#1C222C;
    --paper-3:#2A3242;
    --ink:#E7EBF3;
    --ink-soft:#9AA5B8;
    --indigo:#6FA0F5;
    --indigo-deep:#9CC0FF;
    --vermillion:#FF8A5B;
    --line:#2E3646;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --q-bg:#2A2115;
    --q-border:#4A3B26;
    --mondai-ink:#E8D5B4;
    --page-bg:#35261A;
    --light-ink:#F5ECDA;
    --light-ink-soft:#C9B08A;
    --light-accent:#9CC0FF;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:17px;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:820px; margin:0 auto; padding:2.25rem 1.25rem 6rem;}

  .masthead{
    display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;
    padding-bottom:1.5rem; border-bottom:1px solid var(--line); margin-bottom:1.5rem;
  }
  .masthead-main{flex:1; min-width:0;}
  .masthead-top{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;}
  .kicker{
    display:inline-block; font-size:.72rem; letter-spacing:.14em; font-weight:700;
    color:var(--indigo-deep); background:var(--paper-2);
    padding:.32rem .8rem; border-radius:999px;
  }
  .level-badge{
    display:inline-block; font-family:"Shippori Mincho",serif; font-weight:700;
    font-size:.85rem; letter-spacing:.06em; color:var(--paper);
    background:var(--vermillion); padding:.28rem .85rem; border-radius:999px;
  }
  .brand-logo{
    flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    padding:.55rem .9rem;
    border-radius:.65rem;
    background:var(--indigo-deep); color:var(--paper);
    font-family:"Shippori Mincho",serif; font-weight:700; font-size:1rem; letter-spacing:.1em;
    box-shadow:var(--shadow);
  }
  .masthead h1{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:clamp(1.5rem,4vw,2.05rem);
    margin:.4rem 0 .6rem;
    text-wrap:balance;
    color:var(--light-ink);
  }
  .masthead p{color:var(--light-ink-soft); font-size:.92rem; line-height:1.75; margin:0;}

  .progress-wrap{
    position:sticky; top:0; z-index:20;
    background:var(--page-bg);
    border-bottom:1px solid var(--line);
    padding:.65rem 1.25rem;
    display:flex; align-items:center; gap:.85rem;
    margin:0 -1.25rem 2rem;
  }
  .progress-track{flex:1; height:6px; background:var(--paper-3); border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--indigo),var(--vermillion)); transition:width .35s ease;}
  .progress-label{font-size:.78rem; color:var(--light-ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap;}

  .part h2{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:1.3rem; font-weight:600;
    color:var(--light-accent);
    margin:2.6rem 0 1.3rem;
    padding-bottom:.5rem;
    border-bottom:2px solid var(--light-accent);
  }
  .part:first-of-type h2{margin-top:0;}

  .mondai{margin-bottom:2.6rem;}
  .mondai-head{display:flex; align-items:baseline; gap:.7rem; margin-bottom:.4rem;}
  .mondai-badge{
    flex-shrink:0; width:2.3rem; height:2.3rem; border-radius:50%;
    border:1.5px solid var(--vermillion); color:var(--vermillion);
    font-family:"Shippori Mincho",serif; font-weight:700; font-size:.92rem;
    display:flex; align-items:center; justify-content:center;
  }
  .mondai-title{font-family:"Shippori Mincho",serif; font-weight:700; font-size:1.15rem; color:var(--vermillion);}
  .mondai-instruction{font-size:.9rem; color:var(--light-ink-soft); line-height:1.7; margin:0 0 1rem 3rem;}

  .passage{
    margin:0 0 1.3rem;
    padding:1.3rem 1.4rem;
    border:1px solid var(--line);
    border-radius:.9rem;
    background:var(--paper-2);
    font-size:1rem;
    line-height:1.9;
  }
  .passage-p{margin:0 0 1em;}
  .passage-p:last-child{margin-bottom:0;}
  .pnum{color:var(--vermillion); font-weight:700; border-bottom:2px solid var(--vermillion); padding:0 .15em;}

  .table-wrap{overflow-x:auto; margin:0 0 1.3rem;}
  .schedule-table{width:100%; border-collapse:collapse; font-size:.92rem; background:var(--paper);}
  .schedule-table th, .schedule-table td{border:1px solid var(--line); padding:.6rem .75rem; text-align:left; vertical-align:top;}
  .schedule-table th{background:var(--paper-2); font-weight:700; color:var(--ink); font-size:.82rem;}
  .schedule-table td{color:var(--ink-soft); line-height:1.6;}

  .q{
    display:flex; gap:1rem;
    padding:1.3rem 1.3rem;
    border:1px solid #E6D6B8;
    border-radius:.9rem;
    margin-bottom:.9rem;
    background:#F5ECDA;
    box-shadow:var(--shadow);
  }
  .qnum{
    flex-shrink:0; width:2rem; height:2rem; border-radius:50%;
    background:#E6D6B8; color:#4A3728;
    display:flex; align-items:center; justify-content:center;
    font-size:.85rem; font-weight:700; font-variant-numeric:tabular-nums;
    transition:background .15s, color .15s;
  }
  .q.answered .qnum{background:var(--indigo-deep); color:var(--paper);}
  .qbody{flex:1; min-width:0;}
  .qtext{font-size:1.08rem; line-height:1.9; margin:0 0 .9rem; color:#20242B;}
  .blank{display:inline-block; min-width:2.3em; border-bottom:2px solid var(--indigo); text-align:center; color:var(--indigo); font-weight:600;}
  .star{color:var(--vermillion); font-weight:700;}
  .target-word{text-decoration:underline; text-decoration-color:var(--indigo); text-decoration-thickness:2px; text-underline-offset:3px; font-weight:700; color:#20242B;}
  .uncertain-flag{
    display:inline-block; margin-left:.5rem; font-size:.72rem; font-weight:700;
    color:var(--vermillion); border:1px solid var(--vermillion); border-radius:999px;
    padding:.05rem .5rem; vertical-align:middle;
  }

  .options{display:flex; flex-direction:column; gap:.5rem;}
  .opt{
    position:relative;
    display:flex; align-items:flex-start; gap:.7rem;
    padding:.6rem .75rem; border-radius:.7rem;
    cursor:pointer; border:1px solid transparent;
    background:transparent;
  }
  .opt:hover{background:#E6D6B8;}
  .opt input{position:absolute; opacity:0; width:1px; height:1px; margin:0;}
  .bubble{
    flex-shrink:0; width:1.7rem; height:1.7rem; border-radius:50%;
    border:1.5px solid #E6D6B8;
    display:flex; align-items:center; justify-content:center;
    font-size:.82rem; font-weight:700; color:#5B6472;
    transition:background .15s, border-color .15s, color .15s;
  }
  .opt input:checked ~ .bubble{background:var(--vermillion); border-color:var(--vermillion); color:var(--paper);}
  .opt input:checked ~ .opt-text{color:#20242B; font-weight:600;}
  .opt input:focus-visible ~ .bubble{outline:2px solid var(--indigo); outline-offset:2px;}
  .opt-text{font-size:1rem; line-height:1.7; padding-top:.15rem; color:#5B6472;}

  .submit-area{margin-top:3rem; padding-top:2rem; border-top:2px solid var(--light-accent);}
  .submit-area h2{
    font-family:"Shippori Mincho",serif; font-size:1.05rem; margin:0 0 1.1rem; color:var(--light-ink);
  }
  .field{display:flex; flex-direction:column; gap:.35rem; margin-bottom:1.3rem; max-width:320px;}
  .field label{font-size:.78rem; color:var(--light-ink-soft); letter-spacing:.02em;}
  .field input[type=text]{
    font:inherit; font-size:1rem; padding:.6rem .75rem;
    border:1px solid var(--paper-3); border-radius:.5rem;
    background:var(--paper); color:var(--ink);
  }
  .field input:focus-visible{outline:2px solid var(--indigo); outline-offset:1px;}

  .actions{display:flex; flex-wrap:wrap; align-items:center; gap:.9rem;}
  .btn{
    font:inherit; font-weight:700; font-size:.92rem;
    border-radius:.65rem; padding:.75rem 1.5rem;
    cursor:pointer; border:1.5px solid transparent;
    text-decoration:none; display:inline-flex; align-items:center; gap:.5rem;
  }
  .btn-send{background:var(--vermillion); color:var(--paper); box-shadow:var(--shadow);}
  .btn-send:active{transform:scale(.97);}
  .btn-copy{background:transparent; border-color:var(--light-ink-soft); color:var(--light-ink);}
  .btn-copy:hover{background:rgba(255,255,255,.08);}
  .btn:focus-visible{outline:2px solid var(--indigo); outline-offset:2px;}

  .meta-row{margin-top:.9rem; font-size:.78rem; color:var(--light-ink-soft); line-height:1.7;}
  .meta-row strong{color:var(--light-ink);}
  .unanswered-note{color:var(--vermillion); font-weight:600;}
  .send-status{display:inline-block; font-weight:600;}
  .send-status-ok{color:var(--light-accent);}
  .send-status-error{color:var(--vermillion);}
  .btn:disabled{opacity:.6; cursor:default;}
  .toast{
    display:inline-block; margin-left:.5rem; font-size:.8rem; color:var(--light-accent);
    opacity:0; transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  .result-panel{
    margin-top:1.6rem;
    padding:1.5rem 1.6rem;
    border:1.5px solid var(--indigo-deep);
    border-radius:1rem;
    background:var(--paper-2);
    text-align:center;
  }
  .result-label{font-size:.8rem; letter-spacing:.08em; color:var(--ink-soft); font-weight:700;}
  .result-score{font-family:"Shippori Mincho",serif; margin:.3rem 0 .7rem;}
  .result-score #scoreNum{font-size:2.6rem; font-weight:700; color:var(--vermillion); font-variant-numeric:tabular-nums;}
  .result-score .result-slash{font-size:1.4rem; color:var(--ink-soft);}
  .result-score #scoreTotal{font-size:1.4rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .result-score .result-unit{font-size:1rem; color:var(--ink-soft); margin-left:.15rem;}
  .result-note{font-size:.76rem; color:var(--ink-soft); line-height:1.7; margin:0; text-align:left;}

  footer.config-note{
    margin-top:3rem; padding-top:1.2rem; border-top:1px solid var(--line);
    font-size:.72rem; color:var(--light-ink-soft); line-height:1.7;
  }

  .test-id-badge{
    display:inline-block; font-size:1.05rem; font-weight:700; letter-spacing:.04em;
    color:var(--light-ink); background:rgba(255,255,255,.1);
    border:1px solid var(--light-ink-soft); border-radius:999px;
    padding:.4rem 1.1rem; margin-bottom:.7rem;
  }
  .timer-badge{
    flex-shrink:0; font-variant-numeric:tabular-nums; font-weight:700; font-size:.82rem;
    color:var(--light-ink); background:rgba(255,255,255,.1);
    border:1px solid var(--light-ink-soft); border-radius:999px;
    padding:.3rem .8rem; white-space:nowrap;
  }
  .timer-badge.timer-warn{color:var(--vermillion); border-color:var(--vermillion);}
  .timer-badge.timer-over{color:var(--paper); background:var(--vermillion); border-color:var(--vermillion);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>

<div class="page">
  <header class="masthead">
    <div class="test-id-badge">N3 2022/12　読解等</div>
    <div class="masthead-main">
      <div class="masthead-top">
        <div class="kicker">読解</div>
        <div class="level-badge">N3</div>
      </div>
      <h1>日本語N3模擬テスト（読解） 答案用紙</h1>
      <p>すべての問題に、選択肢の番号（１〜４）を一つずつ選んでください。最後に「お名前」を入力し、下の送信ボタンを押すとメールアプリが開き、その場で自分の点数も表示されます。そのまま送信すれば、解答と点数が先生に届きます。</p>
    </div>
    <div class="brand-logo" title="PHAMKY">PHAMKY</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">回答済み: 0 / 16</div>
    <div class="timer-badge" id="timerBadge">残り時間 50:00</div>
  </div>

  <main id="form"></main>

  <section class="submit-area">
    <h2>解答を送信する</h2>
    <div class="field">
      <label for="studentName">お名前</label>
      <input type="text" id="studentName" placeholder="例：山田 太郎" autocomplete="name">
    </div>
    <div class="field">
      <label for="studentEmail">メールアドレス（任意・先生からの返信を受け取りたい場合）</label>
      <input type="email" id="studentEmail" placeholder="例：taro@example.com" autocomplete="email">
    </div>
    <div class="actions">
      <button type="button" id="sendBtn" class="btn btn-send">先生にメール送信</button>
      <button type="button" id="copyBtn" class="btn btn-copy">解答をコピー</button>
      <span class="toast" id="toast">コピーしました</span>
    </div>
    <div class="meta-row">
      送信先: <strong id="targetEmailLabel"></strong><br>
      <span id="unansweredLabel"></span><br>
      <span id="sendStatus" class="send-status"></span>
    </div>

    <div class="result-panel" id="resultPanel" hidden>
      <div class="result-label">採点結果</div>
      <div class="result-score"><span id="scoreNum">0</span><span class="result-slash"> / </span><span id="scoreTotal">0</span><span class="result-unit">点</span></div>
    </div>
  </section>

  <footer class="config-note">
    ※ メールアプリが自動で開かない場合は「解答をコピー」ボタンでコピーし、メール本文に貼り付けてください。
  </footer>
</div>

<script>
(function(){
  const CONFIG = {
    teacherEmail: 'phamkyphung@gmail.com',
    testName: '日本語N3模擬テスト【2022年12月・読解】'
  };

  const TEST_DATA = [
    {
      title: '読解',
      mondai: [
        {
          key: 'm1', title: '問題１',
          instruction: '次の（１）から（４）の文章を読んで、質問に答えなさい。答えは、１・２・３・４から最もよいものを一つえらびなさい。',
          clusters: [
            {
              boxed: true,
              blocks: [
                { text: '（会社で）コピー機の上に、この紙が置いてある。\n\n営業課の皆さんへ\n\n営業課のコピー機は今、故障していて使えません。修理を頼んでいますが、明日の午後まで来られないそうです。急ぎでないコピーは、明日まで待ってください。\n\n今日中にコピーしなければならない書類がある場合は、会計課のコピー機を使用してください。50枚以上コピーをする場合は、先に会計課に連絡をしておく必要がありますので、コピーをする前に中島に知らせてください。' }
              ],
              items: [
                { text: '営業課のホンさんは、明日の朝の会議で使う資料を今日中に5枚コピーしたいと考えている。どうしなければならないか。', options: ['営業課でコピーをする。中島さんに言う必要はない。','会計課でコピーをする。中島さんに言う必要はない。','中島さんに言ってから、営業課でコピーをする。','中島さんに言ってから、会計課でコピーをする。'] }
              ]
            },
            {
              boxed: true,
              blocks: [
                { text: '6歳の娘がボールを上手に投げられるようになりたいと言う。私は娘の投げ方の悪い点をいろいろと説明して、何回もボールを投げさせているが、娘はなかなかうまくならない。\n\n昨日、あるテレビ番組でボール投げについて取り上げていた。番組では、子供に大きさや重さの違うさまざまなボールを投げさせたり、紙飛行機を飛ばさせたりして、ちょうどいい力の入れ方を体で覚えさせていた。娘に必要なのは、これかもしれない。次は、このやり方を娘にやらせてみようと思う。' }
              ],
              items: [
                { text: 'テレビ番組を見て、「私」は娘のボール投げがうまくならないのは、なぜだと思ったか。', options: ['上手な投げ方についての「私」の説明が下手だったから。','繰り返し同じ投げ方で投げる練習をさせていなかったから。','実際に「私」が上手に投げているところを見せていなかったから。','ちょうどいい力の入れ方を体で覚える練習をさせていなかったから。'] }
              ]
            },
            {
              boxed: true,
              blocks: [
                { text: 'これは、ある店が客の寺坂さんに書いたメールである。\n\n寺坂ゆき様\n\nいつもご利用いただき、ありがとうございます。\n\n2月4日にいただいたご注文についてのご連絡です。寺坂様がホームページからご注文になった革製財布（茶色）ですが、直前の電話注文で品切れになっておりました。大変申し訳ございません。お届けできるのは3月上旬になってしまいますが、いかがいたしましょうか。キャンセルもお受けいたしますので、ご希望をお聞かせください。\n\nなお、同じ商品の違う色でしたら、すぐにお送りできます。あわせてご検討ください。\n\n財布専門店タキグチ　広田\nt.hirota@saifu-takiguchi.yuukibui.co.jp' }
              ],
              items: [
                { text: 'このメールで言いたいこととして、合っているのはどれか。', options: ['商品が品切れになったから、3月上旬に送る。','商品が品切れになったから、3月上旬にもう一度注文してほしい。','商品が品切れで、届けるまでに時間がかかるから、どうしたいか知らせてほしい。','注文と違う色の商品を送ってしまったから、正しい色のものをすぐに送る。'] }
              ]
            },
            {
              boxed: true,
              blocks: [
                { text: '私の家には、履かなくなった古い靴がたくさんある。捨てようかと思っていたとき、ある靴屋のちらしを見た。いらない靴を店に持っていけば、その店で使える割引券と交換してくれるそうだ。回収した靴を燃やす（注）ときに出る熱が、電気を作るためのエネルギーに利用できて、環境にいいとも書かれていた。私一人が持っていっても、環境にそんなに大きい影響はないと思うが、新しい靴が安く買えるなら、古い靴は捨てないで店に持っていこうと思った。\n\n（注）燃やす：焼く' }
              ],
              items: [
                { text: '「私」が古い靴を店に持っていこうと思った理由の中で、最も大きいものはどれか。', options: ['古い靴を割引券と交換して、新しい靴を買うときに使いたいと思ったから。','古い靴を売ってお金をもらい、そのお金で新しい靴を買いたいと思ったから。','古い靴をきれいに直してもらって、もう一度履きたいと思ったから。','古い靴を利用してもらって、環境をよくしたいと思ったから。'] }
              ]
            }
          ]
        },
        {
          key: 'm2', title: '問題２',
          instruction: '次の（１）と（２）の文章を読んで、質問に答えなさい。答えは、１・２・３・４から最もよいものを一つえらびなさい。',
          clusters: [
            {

  // 解答PDF（答え N3 T12-2022.pdf）の解答表より
  const ANSWER_KEY = {
    m1_1:2, m1_2:4, m1_3:3, m1_4:1,
    m2_1:4, m2_2:4, m2_3:2, m2_4:1, m2_5:4, m2_6:3,
    m3_1:1, m3_2:2, m3_3:1, m3_4:3,
    m4_1:4, m4_2:2
  };
  const UNCERTAIN_QIDS = new Set();
  const EXCLUDED_QIDS = new Set();

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function renderPromptHtml(text){
    return escapeHtml(text)
      .replace(/\n/g, '<br>')
      .replace(/（\s*）/g, '<span class="blank">（　）</span>')
      .replace(/_{2,}/g, '<span class="blank">＿＿＿</span>')
      .replace(/★/g, '<span class="star">★</span>')
      .replace(/\*\*(.+?)\*\*/g, '<span class="target-word">$1</span>');
  }

  function renderPassageHtml(text){
    return text.split(/\n\n+/).map(function(para){
      let html = escapeHtml(para)
        .replace(/\n/g, '<br>')
        .replace(/([①②③④⑤⑥⑦⑧⑨⑩])/g, '<span class="pnum">$1</span>');
      return '<p class="passage-p">' + html + '</p>';
    }).join('');
  }

  function renderTableHtml(table){
    let html = '<div class="table-wrap"><table class="schedule-table"><thead><tr>';
    table.headers.forEach(h => { html += '<th>' + escapeHtml(h) + '</th>'; });
    html += '</tr></thead><tbody>';
    table.rows.forEach(row => {
      html += '<tr>';
      row.forEach(cell => { html += '<td>' + escapeHtml(cell).replace(/\n/g,'<br>') + '</td>'; });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  function renderBlocksHtml(blocks){
    let html = '';
    blocks.forEach(b => {
      if (b.text) html += '<div class="passage">' + renderPassageHtml(b.text) + '</div>';
      if (b.table) html += renderTableHtml(b.table);
    });
    return html;
  }

  function flattenMondaiItems(m){
    const list = [];
    let idx = 0;
    const sources = m.clusters
      ? m.clusters.reduce((acc, c) => acc.concat(c.items), [])
      : m.items;
    sources.forEach(item => {
      idx++;
      list.push({ item: item, idx: idx, qid: m.key + '_' + idx });
    });
    return list;
  }

  function renderQuestionHtml(m, entry){
    const item = entry.item, idx = entry.idx, qid = entry.qid;
    const flag = UNCERTAIN_QIDS.has(qid) ? '<span class="uncertain-flag">要確認</span>' : '';
    let html = '<div class="q" data-qid="' + qid + '">';
    html += '  <div class="qnum">' + idx + '</div>';
    html += '  <div class="qbody">';
    html += '    <p class="qtext">' + renderPromptHtml(item.text) + flag + '</p>';
    html += '    <div class="options" role="radiogroup" aria-label="' + escapeHtml(m.title) + '(' + idx + ')">';
    item.options.forEach((opt, i) => {
      html += '<label class="opt">';
      html += '  <input type="radio" name="' + qid + '" value="' + (i + 1) + '" data-text="' + escapeHtml(opt) + '">';
      html += '  <span class="bubble">' + (i + 1) + '</span>';
      html += '  <span class="opt-text">' + escapeHtml(opt) + '</span>';
      html += '</label>';
    });
    html += '    </div>';
    html += '  </div>';
    html += '</div>';
    return html;
  }

  const formEl = document.getElementById('form');
  let totalQuestions = 0;

  TEST_DATA.forEach(part => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = '<h2>' + escapeHtml(part.title) + '</h2>';

    part.mondai.forEach(m => {
      const mEl = document.createElement('div');
      mEl.className = 'mondai';
      let html = '';
      html += '<div class="mondai-head"><div class="mondai-badge">' + m.key.replace('m','') + '</div><div class="mondai-title">' + escapeHtml(m.title) + '</div></div>';
      html += '<p class="mondai-instruction">' + escapeHtml(m.instruction) + '</p>';

      if (m.clusters) {
        let idx = 0;
        m.clusters.forEach(cluster => {
          if (cluster.blocks) {
            html += renderBlocksHtml(cluster.blocks);
          }
          cluster.items.forEach(item => {
            idx++;
            totalQuestions++;
            html += renderQuestionHtml(m, { item: item, idx: idx, qid: m.key + '_' + idx });
          });
        });
      } else {
        flattenMondaiItems(m).forEach(entry => {
          totalQuestions++;
          html += renderQuestionHtml(m, entry);
        });
      }

      mEl.innerHTML = html;
      partEl.appendChild(mEl);
    });

    formEl.appendChild(partEl);
  });

  document.getElementById('targetEmailLabel').textContent = CONFIG.teacherEmail;

  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const unansweredLabel = document.getElementById('unansweredLabel');

  function updateProgress(){
    let answered = 0;
    TEST_DATA.forEach(part => part.mondai.forEach(m => flattenMondaiItems(m).forEach(entry => {
      const qid = entry.qid;
      const checked = formEl.querySelector('input[name="' + qid + '"]:checked');
      const qEl = formEl.querySelector('.q[data-qid="' + qid + '"]');
      if (checked) {
        answered++;
        if (qEl) qEl.classList.add('answered');
      } else if (qEl) {
        qEl.classList.remove('answered');
      }
    })));
    progressFill.style.width = (answered / totalQuestions * 100) + '%';
    progressLabel.textContent = '回答済み: ' + answered + ' / ' + totalQuestions;
    const remaining = totalQuestions - answered;
    unansweredLabel.textContent = remaining > 0 ? ('未回答: ' + remaining + '問') : 'すべて回答済みです';
    unansweredLabel.className = remaining > 0 ? 'unanswered-note' : '';
    return answered;
  }

  formEl.addEventListener('change', updateProgress);
  updateProgress();

  (function(){
    const timerEl = document.getElementById('timerBadge');
    if (!timerEl) return;
    const LIMIT_SECONDS = 50 * 60;
    const startTime = Date.now();
    let timerId;
    function formatTime(sec){
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + ':' + String(s).padStart(2, '0');
    }
    function tick(){
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const remaining = LIMIT_SECONDS - elapsed;
      if (remaining <= 0) {
        timerEl.textContent = '残り時間 0:00（時間切れ）';
        timerEl.classList.add('timer-over');
        clearInterval(timerId);
        if (!sendBtn.disabled) sendReport(true);
        return;
      }
      timerEl.textContent = '残り時間 ' + formatTime(remaining);
      timerEl.classList.toggle('timer-warn', remaining <= 300);
    }
    tick();
    timerId = setInterval(tick, 1000);
  })();

  function buildReport(){
    const name = document.getElementById('studentName').value.trim();
    const lines = [];
    lines.push(CONFIG.testName + ' 解答');
    lines.push('お名前: ' + (name || '（未入力）'));
    lines.push('送信日時: ' + new Date().toLocaleString('ja-JP'));
    lines.push('');
    let answered = 0;
    let correct = 0;
    let scoredTotal = 0;
    TEST_DATA.forEach(part => {
      lines.push('■ ' + part.title);
      part.mondai.forEach(m => {
        lines.push('【' + m.title + '】');
        flattenMondaiItems(m).forEach(entry => {
          const qid = entry.qid;
          const checked = formEl.querySelector('input[name="' + qid + '"]:checked');
          const isExcluded = EXCLUDED_QIDS.has(qid);
          const answerKey = ANSWER_KEY[qid];
          if (checked) answered++;

          let mark = '';
          if (isExcluded) {
            mark = '（採点対象外）';
          } else {
            scoredTotal++;
            const isCorrect = checked && parseInt(checked.value, 10) === answerKey;
            if (isCorrect) {
              correct++;
              mark = ' ✓';
            } else {
              mark = ' ✗（正解: ' + answerKey + '）';
            }
          }
          if (UNCERTAIN_QIDS.has(qid)) mark += ' ※要確認';

          lines.push('(' + entry.idx + ') → ' + (checked ? checked.value + '. ' + checked.dataset.text : '未回答') + mark);
        });
        lines.push('');
      });
    });
    lines.push('----');
    lines.push('回答済み: ' + answered + ' / ' + totalQuestions);
    lines.push('得点: ' + correct + ' / ' + scoredTotal + '点');
    return {
      subject: CONFIG.testName + ' 解答 - ' + (name || '無記名') + '（' + correct + '/' + scoredTotal + '点）',
      body: lines.join('\n'),
      answered: answered,
      correct: correct,
      scoredTotal: scoredTotal
    };
  }

  const resultPanel = document.getElementById('resultPanel');
  const scoreNumEl = document.getElementById('scoreNum');
  const scoreTotalEl = document.getElementById('scoreTotal');

  function showResult(report){
    scoreNumEl.textContent = report.correct;
    scoreTotalEl.textContent = report.scoredTotal;
    resultPanel.hidden = false;
    resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const sendBtn = document.getElementById('sendBtn');
  const sendStatus = document.getElementById('sendStatus');
  const sendBtnDefaultLabel = sendBtn.textContent;

  function sendReport(auto){
    const report = buildReport();
    showResult(report);

    sendBtn.disabled = true;
    sendBtn.textContent = '送信中…';
    sendStatus.textContent = auto ? '制限時間になったため、自動的に送信しています…' : '';
    sendStatus.className = 'send-status';

    const studentEmail = document.getElementById('studentEmail').value.trim();
    const payload = {
      _subject: report.subject + (auto ? '（制限時間超過による自動送信）' : ''),
      _captcha: 'false',
      お名前: document.getElementById('studentName').value.trim() || '無記名',
      得点: report.correct + ' / ' + report.scoredTotal + '点',
      解答内容: report.body
    };
    if (studentEmail) payload._replyto = studentEmail;

    fetch('https://formsubmit.co/ajax/' + encodeURIComponent(CONFIG.teacherEmail), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(res){
      if (!res.ok) throw new Error('send failed');
      return res.json();
    }).then(function(){
      sendBtn.textContent = '送信しました ✓';
      sendStatus.textContent = auto ? '制限時間になったため、自動的に先生へ送信しました。' : '先生に送信しました。';
      sendStatus.className = 'send-status send-status-ok';
    }).catch(function(){
      sendBtn.disabled = false;
      sendBtn.textContent = sendBtnDefaultLabel;
      sendStatus.textContent = '送信に失敗しました。「解答をコピー」ボタンで代わりに送ってください。';
      sendStatus.className = 'send-status send-status-error';
    });
  }

      setTimeout(() => toast.classList.remove('show'), 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showToast).catch(() => {
        window.prompt('以下をコピーしてください:', text);
      });
    } else {
      window.prompt('以下をコピーしてください:', text);
    }
  });
})();
</script>
