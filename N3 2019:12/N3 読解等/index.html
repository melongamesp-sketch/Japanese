<title>日本語N3模擬テスト（読解）答案用紙</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-2:#EFF4FC;
    --paper-3:#DCE7F6;
    --ink:#20242B;
    --ink-soft:#5B6472;
    --indigo:#2F6FE0;
    --indigo-deep:#1E4FB0;
    --vermillion:#F2703D;
    --line:#E3E9F3;
    --shadow: 0 1px 2px rgba(32,36,43,.05), 0 6px 18px rgba(32,36,43,.06);
    --q-bg:#F5ECDA;
    --q-border:#E6D6B8;
    --mondai-ink:#4A3728;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14181F;
      --paper-2:#1C222C;
      --paper-3:#2A3242;
      --ink:#E7EBF3;
      --ink-soft:#9AA5B8;
      --indigo:#6FA0F5;
      --indigo-deep:#9CC0FF;
      --vermillion:#FF8A5B;
      --line:#2E3646;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --q-bg:#2A2115;
      --q-border:#4A3B26;
      --mondai-ink:#E8D5B4;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14181F;
    --paper-2:#1C222C;
    --paper-3:#2A3242;
    --ink:#E7EBF3;
    --ink-soft:#9AA5B8;
    --indigo:#6FA0F5;
    --indigo-deep:#9CC0FF;
    --vermillion:#FF8A5B;
    --line:#2E3646;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --q-bg:#2A2115;
    --q-border:#4A3B26;
    --mondai-ink:#E8D5B4;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:17px;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:820px; margin:0 auto; padding:2.25rem 1.25rem 6rem;}

  .masthead{
    display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;
    padding-bottom:1.5rem; border-bottom:1px solid var(--line); margin-bottom:1.5rem;
  }
  .masthead-main{flex:1; min-width:0;}
  .masthead-top{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;}
  .kicker{
    display:inline-block; font-size:.72rem; letter-spacing:.14em; font-weight:700;
    color:var(--indigo-deep); background:var(--paper-2);
    padding:.32rem .8rem; border-radius:999px;
  }
  .level-badge{
    display:inline-block; font-family:"Shippori Mincho",serif; font-weight:700;
    font-size:.85rem; letter-spacing:.06em; color:var(--paper);
    background:var(--vermillion); padding:.28rem .85rem; border-radius:999px;
  }
  .brand-logo{
    flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    padding:.55rem .9rem;
    border-radius:.65rem;
    background:var(--indigo-deep); color:var(--paper);
    font-family:"Shippori Mincho",serif; font-weight:700; font-size:1rem; letter-spacing:.1em;
    box-shadow:var(--shadow);
  }
  .masthead h1{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:clamp(1.5rem,4vw,2.05rem);
    margin:.4rem 0 .6rem;
    text-wrap:balance;
    color:var(--ink);
  }
  .masthead p{color:var(--ink-soft); font-size:.92rem; line-height:1.75; margin:0;}

  .progress-wrap{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:.65rem 1.25rem;
    display:flex; align-items:center; gap:.85rem;
    margin:0 -1.25rem 2rem;
  }
  .progress-track{flex:1; height:6px; background:var(--paper-3); border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--indigo),var(--vermillion)); transition:width .35s ease;}
  .progress-label{font-size:.78rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap;}

  .part h2{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:1.3rem; font-weight:600;
    color:var(--indigo-deep);
    margin:2.6rem 0 1.3rem;
    padding-bottom:.5rem;
    border-bottom:2px solid var(--indigo-deep);
  }
  .part:first-of-type h2{margin-top:0;}

  .mondai{margin-bottom:2.6rem;}
  .mondai-head{display:flex; align-items:baseline; gap:.7rem; margin-bottom:.4rem;}
  .mondai-badge{
    flex-shrink:0; width:2.3rem; height:2.3rem; border-radius:50%;
    border:1.5px solid var(--mondai-ink); color:var(--mondai-ink);
    font-family:"Shippori Mincho",serif; font-weight:700; font-size:.92rem;
    display:flex; align-items:center; justify-content:center;
  }
  .mondai-title{font-family:"Shippori Mincho",serif; font-weight:700; font-size:1.15rem; color:var(--mondai-ink);}
  .mondai-instruction{font-size:.9rem; color:var(--ink-soft); line-height:1.7; margin:0 0 1rem 3rem;}

  .passage{
    margin:0 0 1.3rem;
    padding:1.3rem 1.4rem;
    border:1px solid var(--line);
    border-radius:.9rem;
    background:var(--paper-2);
    font-size:1rem;
    line-height:1.9;
  }
  .passage-p{margin:0 0 1em;}
  .passage-p:last-child{margin-bottom:0;}
  .passage.passage-plain{border:none; background:transparent; padding:0 0 1.2rem; border-radius:0;}
  .pnum{color:var(--vermillion); font-weight:700; border-bottom:2px solid var(--vermillion); padding:0 .15em;}

  .table-wrap{overflow-x:auto; margin:0 0 1.3rem;}
  .schedule-table{width:100%; border-collapse:collapse; font-size:.92rem; background:var(--paper);}
  .schedule-table th, .schedule-table td{border:1px solid var(--line); padding:.6rem .75rem; text-align:left; vertical-align:top;}
  .schedule-table th{background:var(--paper-2); font-weight:700; color:var(--ink); font-size:.82rem;}
  .schedule-table td{color:var(--ink-soft); line-height:1.6;}

  .q{
    display:flex; gap:1rem;
    padding:1.3rem 1.3rem;
    border:1px solid var(--q-border);
    border-radius:.9rem;
    margin-bottom:.9rem;
    background:var(--q-bg);
    box-shadow:var(--shadow);
  }
  .qnum{
    flex-shrink:0; width:2rem; height:2rem; border-radius:50%;
    background:var(--q-border); color:var(--mondai-ink);
    display:flex; align-items:center; justify-content:center;
    font-size:.85rem; font-weight:700; font-variant-numeric:tabular-nums;
    transition:background .15s, color .15s;
  }
  .q.answered .qnum{background:var(--indigo-deep); color:var(--paper);}
  .qbody{flex:1; min-width:0;}
  .qtext{font-size:1.08rem; line-height:1.9; margin:0 0 .9rem;}
  .blank{display:inline-block; min-width:2.3em; border-bottom:2px solid var(--indigo); text-align:center; color:var(--indigo); font-weight:600;}
  .star{color:var(--vermillion); font-weight:700;}
  .target-word{text-decoration:underline; text-decoration-color:var(--indigo); text-decoration-thickness:2px; text-underline-offset:3px; font-weight:700; color:var(--ink);}
  .uncertain-flag{
    display:inline-block; margin-left:.5rem; font-size:.72rem; font-weight:700;
    color:var(--vermillion); border:1px solid var(--vermillion); border-radius:999px;
    padding:.05rem .5rem; vertical-align:middle;
  }

  .options{display:flex; flex-direction:column; gap:.5rem;}
  .opt{
    position:relative;
    display:flex; align-items:flex-start; gap:.7rem;
    padding:.6rem .75rem; border-radius:.7rem;
    cursor:pointer; border:1px solid transparent;
    background:transparent;
  }
  .opt:hover{background:var(--q-border);}
  .opt input{position:absolute; opacity:0; width:1px; height:1px; margin:0;}
  .bubble{
    flex-shrink:0; width:1.7rem; height:1.7rem; border-radius:50%;
    border:1.5px solid var(--q-border);
    display:flex; align-items:center; justify-content:center;
    font-size:.82rem; font-weight:700; color:var(--ink-soft);
    transition:background .15s, border-color .15s, color .15s;
  }
  .opt input:checked ~ .bubble{background:var(--vermillion); border-color:var(--vermillion); color:var(--paper);}
  .opt input:checked ~ .opt-text{color:var(--ink); font-weight:600;}
  .opt input:focus-visible ~ .bubble{outline:2px solid var(--indigo); outline-offset:2px;}
  .opt-text{font-size:1rem; line-height:1.7; padding-top:.15rem; color:var(--ink-soft);}

  .submit-area{margin-top:3rem; padding-top:2rem; border-top:2px solid var(--indigo-deep);}
  .submit-area h2{
    font-family:"Shippori Mincho",serif; font-size:1.05rem; margin:0 0 1.1rem; color:var(--ink);
  }
  .field{display:flex; flex-direction:column; gap:.35rem; margin-bottom:1.3rem; max-width:320px;}
  .field label{font-size:.78rem; color:var(--ink-soft); letter-spacing:.02em;}
  .field input[type=text]{
    font:inherit; font-size:1rem; padding:.6rem .75rem;
    border:1px solid var(--paper-3); border-radius:.5rem;
    background:var(--paper); color:var(--ink);
  }
  .field input:focus-visible{outline:2px solid var(--indigo); outline-offset:1px;}

  .actions{display:flex; flex-wrap:wrap; align-items:center; gap:.9rem;}
  .btn{
    font:inherit; font-weight:700; font-size:.92rem;
    border-radius:.65rem; padding:.75rem 1.5rem;
    cursor:pointer; border:1.5px solid transparent;
    text-decoration:none; display:inline-flex; align-items:center; gap:.5rem;
  }
  .btn-send{background:var(--vermillion); color:var(--paper); box-shadow:var(--shadow);}
  .btn-send:active{transform:scale(.97);}
  .btn-copy{background:transparent; border-color:var(--paper-3); color:var(--ink);}
  .btn-copy:hover{background:var(--paper-2);}
  .btn:focus-visible{outline:2px solid var(--indigo); outline-offset:2px;}

  .meta-row{margin-top:.9rem; font-size:.78rem; color:var(--ink-soft); line-height:1.7;}
  .meta-row strong{color:var(--ink);}
  .unanswered-note{color:var(--vermillion); font-weight:600;}
  .send-status{display:inline-block; font-weight:600;}
  .send-status-ok{color:var(--indigo-deep);}
  .send-status-error{color:var(--vermillion);}
  .btn:disabled{opacity:.6; cursor:default;}
  .toast{
    display:inline-block; margin-left:.5rem; font-size:.8rem; color:var(--indigo-deep);
    opacity:0; transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  .result-panel{
    margin-top:1.6rem;
    padding:1.5rem 1.6rem;
    border:1.5px solid var(--indigo-deep);
    border-radius:1rem;
    background:var(--paper-2);
    text-align:center;
  }
  .result-label{font-size:.8rem; letter-spacing:.08em; color:var(--ink-soft); font-weight:700;}
  .result-score{font-family:"Shippori Mincho",serif; margin:.3rem 0 .7rem;}
  .result-score #scoreNum{font-size:2.6rem; font-weight:700; color:var(--vermillion); font-variant-numeric:tabular-nums;}
  .result-score .result-slash{font-size:1.4rem; color:var(--ink-soft);}
  .result-score #scoreTotal{font-size:1.4rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .result-score .result-unit{font-size:1rem; color:var(--ink-soft); margin-left:.15rem;}
  .result-note{font-size:.76rem; color:var(--ink-soft); line-height:1.7; margin:0; text-align:left;}

  footer.config-note{
    margin-top:3rem; padding-top:1.2rem; border-top:1px solid var(--line);
    font-size:.72rem; color:var(--ink-soft); line-height:1.7;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>

<div class="page">
  <header class="masthead">
    <div class="masthead-main">
      <div class="masthead-top">
        <div class="kicker">読解</div>
        <div class="level-badge">N3</div>
      </div>
      <h1>日本語N3模擬テスト（読解） 答案用紙</h1>
      <p>すべての問題に、選択肢の番号（１〜４）を一つずつ選んでください。最後に「お名前」を入力し、下の送信ボタンを押すとメールアプリが開き、その場で自分の点数も表示されます。そのまま送信すれば、解答と点数が先生に届きます。</p>
    </div>
    <div class="brand-logo" title="PHAM">PHAM</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">回答済み: 0 / 16</div>
  </div>

  <main id="form"></main>

  <section class="submit-area">
    <h2>解答を送信する</h2>
    <div class="field">
      <label for="studentName">お名前</label>
      <input type="text" id="studentName" placeholder="例：山田 太郎" autocomplete="name">
    </div>
    <div class="field">
      <label for="studentEmail">メールアドレス（任意・先生からの返信を受け取りたい場合）</label>
      <input type="email" id="studentEmail" placeholder="例：taro@example.com" autocomplete="email">
    </div>
    <div class="actions">
      <button type="button" id="sendBtn" class="btn btn-send">先生にメール送信</button>
      <button type="button" id="copyBtn" class="btn btn-copy">解答をコピー</button>
      <span class="toast" id="toast">コピーしました</span>
    </div>
    <div class="meta-row">
      送信先: <strong id="targetEmailLabel"></strong><br>
      <span id="unansweredLabel"></span><br>
      <span id="sendStatus" class="send-status"></span>
    </div>

    <div class="result-panel" id="resultPanel" hidden>
      <div class="result-label">採点結果</div>
      <div class="result-score"><span id="scoreNum">0</span><span class="result-slash"> / </span><span id="scoreTotal">0</span><span class="result-unit">点</span></div>
    </div>
  </section>

  <footer class="config-note">
    ※ メールアプリが自動で開かない場合は「解答をコピー」ボタンでコピーし、メール本文に貼り付けてください。
  </footer>
</div>

<script>
(function(){
  const CONFIG = {
    teacherEmail: 'phamkyphung@gmail.com',
    testName: '日本語N3模擬テスト【2019年12月・読解】'
  };

  const TEST_DATA = [
    {
      title: '読解',
      mondai: [
        {
          key: 'm1', title: '問題１',
          instruction: '文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。',
          clusters: [
            {
              boxed: true,
              passage: 'これは大学の掲示板にはってあるお知らせである。\n\n家庭教師募集\n\n医学部受験のため、高校3年生の息子に数学を教えてくれる大学生の方を探しています。\n回数：週2回\n時間：1回2時間\n平日（火曜以外）…19時から21時まで\n土曜、日曜…9時から19時の間で都合のいい時間をお知らせください。\n時給：3,000円（交通費もお支払いします）\n\n学部の希望は特にありませんが、受験生に数学の指導をしたことがある、明るい性格の方にお願いしたいです。数学が専門でなくてもけっこうです。\n\nお電話をお待ちしています。\n今泉市野田町\n091-021-4678\n髙島',
              items: [
                { text: '家庭教師について、髙島さんの希望に合っているものはどれか。', options: ['医学部の学生で、火曜と土曜に教えられること','受験生に数学を教えた経験があり、週に2回教えられること','数学が専門の学生で、週に2時間教えられること','明るい性格で、土曜と日曜の19時から21時まで教えられること。'] }
              ]
            },
            {
              boxed: true,
              passage: 'これは、本田さんが文房具店に送ったメールである。\n\n中野文房具\n中野様\n\n注文した商品が昨日届いたのですが、足りないものがありました。\n注文したのはコピー用紙1箱とプリンターの黒のインク3箱と青のインク1箱でしたが、黒のインクは1箱しか入っていませんでした。確かめていただけないでしょうか。よろしくお願いします。\n\n本田みどり',
              items: [
                { text: '足りないものは何か。', options: ['コピー用紙1箱と、プリンタの黒のインク2箱と青のインク1箱','コピー用紙1箱と、プリンターの黒のインク2箱と青のインク1箱','プリンタの黒のインク2箱','プリンタの黒のインク1箱。'] }
              ]
            },
            {
              boxed: true,
              passage: '私は先週から新しい会社で働いているのだが、怖い先輩が一人いる。ほかの人と話すときは笑顔なのに、私と話すときは笑顔ではなくなるのだ。先輩に嫌われているかもしれないと思って、隣の席の人に相談してみた。すると「あの人は、初めて会う人が苦手で、緊張しちゃって笑えなくなるんだよ。もう少ししたら慣れると思うから、緊張しないで」と言われました。自分が嫌われているのではないらしいことがわかって、安心した。',
              items: [
                { text: '隣の席の人によると、先輩が私と話すときは笑顔ではなくなるのはなぜか。', options: ['会社に入ったばかりの「私」と話すのは緊張するから','会社に入ったばかりのは「私」を心配しているから','先輩のことを怖がっている「私」と話したくないから','先輩のことを怖がっている「私」を嫌っているから。'] }
              ]
            },
            {
              boxed: true,
              passage: '先日、大型電気店に行ったとき、久しぶりにイヤホン売り場を通りかかって驚いた。種類がかなり増えていて、10万円以上するものもあった。いくつかのイヤホンで音を聞いてみたが、それほど高くないものでも、十分よい音だった。店の人によると、最近は、複数のイヤホンを持ち、ロックやクラシックなど聴く音楽に合わせて、使うイヤホンを変える人もいるそうだ。私は今まではスピーカーでしか聞いていなかったが、同じようにやってみたくなった。',
              items: [
                { text: '何をやってみたくなったのか。', options: ['10万円以上するイヤホンを一つ買って、スピーカーの音と比べて音楽を楽しむこと','10万円以上のイヤホンを一つ買って、いろいろな音楽を楽しむこと','聴く音楽に合わせて複数のスピーカーを買って、音楽を楽しむこと','聴く音楽に合わせて複数のイヤホンを買って、音楽を楽しむこと'] }
              ]
            }
          ]
        },
        {
          key: 'm2', title: '問題２',
          instruction: '次の1から2の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。',
          clusters: [
            {
              boxed: true,
              passage: '近所の写真屋で「お子様の自然な笑顔を残しませんか」というポスターを見ました。プロのカメラマンが近くの公園で写真を撮ってくれるそうなので、頼んでみることにしました。私には4歳の娘がいます。娘の自然な笑顔が撮りたいのですが、自分ではなかなかうまくいかなくて、困っていたので。\n\n当日、カメラマンは公園のブランコで遊ぶ娘のすぐ近くで撮り始めました。娘がカメラを気にしていたので、私はそんなやり方でいい写真が撮れるのだろうかと思いました。しかし、カメラマンはその後もしばらくそのまま撮り続けていました。20分ぐらいたつと、娘はカメラマンがそばにいることを気にしなくなっていきました。\n\n1時間撮ったあと、見せてくれた写真には、娘のいい笑顔が何枚も写っていました。「自然な笑顔が撮れるのは、カメラに慣れて意識しなくなってからなんです。はじめの20分はそのための準備です。」と教えてくれました。プロの工夫を聞いて、なるほどと感心しました。',
              items: [
                { text: 'なぜ「私」はカメラマンに頼むことにしたのか。', options: ['娘の写真を使って、ポスターを作りたいから','娘がプロのカメラマンに撮ってもらいたいといったから','娘が公園で写真を撮ってもらうのが好きだから','娘の自然な笑顔の写真が、自分ではうまく撮れないから。'] },
                { text: 'そんなやり方とあるが、何か。', options: ['ブランコで遊んでいる娘を撮り続けたこと','娘と一緒にブランコで遊びながら撮り始めたこと','カメラを気にしている娘のすぐ近くで撮り始めたこと','20分近くも娘を撮り続けていたこと。'] },
                { text: '工夫とあるが、どのようなことか。', options: ['子供が知らない場所で緊張しないように、慣れている場所で撮ること','子供が抱きてしまわないように、なるべく時間をかけないで撮ること','子供がカメラマンに慣れるように、カメラマンが笑顔で撮り続けること','子供が撮られることに慣れるように、写真を撮り続けること。'] }
              ]
            },
            {
              boxed: true,
              passage: '先日、友だちと向かい合って食事をしていて、友達のほほにソースがついているのに気づいた。「私は右のほほにソースがついているよ」と教えたら、友達は反対側のほほをふいた。「あ、そっちじゃなくて、私から見て右だよ」といったら、「こっちか」と友達は拭いた。自分の思っている「右」を相手に正しく伝えるのが難しい。\n\nインターネットで「右」を調べたら「人体の心臓のない側」とあった。しかし、これは向かい合っていると、相手の心臓が私の心臓かで逆になってしまう。それに、心臓が右にある人もいるそうだ。「はしを持つ方」と言う説明もあるが、これも同じことだ。\n\nでは、誰にとっても変わらないものは何だろう。方角なら誰にとってもどんな場所でも変わらない。先日も、「西側のほほ」といえば、正しく伝わったかもしれない。\n\nしかし、私たちはいつも方角を考えて生活してはいないので、実際にはこのような言い方はできそうにない。結局、相手と自分の位置関係を考えながら、「右」「左」という言葉を使う以外の方法はないだろう。',
              items: [
                { text: '自分の思っている「右」を相手に正しく伝えるのが難しいといったのはなぜか。', options: ['ソースがついていたほほは、「私」から見ても、友達にとっても「右」だったから','ソースがついていたほほは、「私」から見ても、友達にとっても「左」だったから','ソースがついていたほほは、「私」から見て「右」だったが、友達にとっては「左」だったから','ソースがついていたほほは、「私」から見て「左」だったが、友達にとっては「右」だったから。'] },
                { text: '正しく伝わったかもしれないとあるが、ここで「私」が正しく伝わると考えたのはどのような説明か。', options: ['どんな人にとっても変わらないものを使った説明','インターネットで広く紹介されている説明','体の一部分を表す言葉を使った説明','人によって変わるものを使った説明。'] },
                { text: '先日と同じことがあったとき、間違いなく確実に伝えるためには、「私」は今後、どのような言い方をすると考えられるか。', options: ['「右のほほにソースがついているよ。」','「心臓がある側のほほにソースがついているよ」','「西側のほほにソースがついているよ」','「私から見て右のほほにソースがついているよ」'] }
              ]
            }
          ]
        },
        {
          key: 'm3', title: '問題３',
          instruction: '次の文章を読んで、後の問いに対する答えとして最もよいものを、１・２・３・４から一つ選びなさい。',
          clusters: [
            {
              boxed: true,
              passage: '私の会社では、毎日何時間もいすに座って仕事をするので、首や肩や腰が痛くなると言う人が多い。私も腰の痛みに悩んでいる。先日インターネットを見ていたら、面白いサイトがあった。腰の痛みを治すには、まず、仕事を座ってするという考え方を変えたほうがいいと書いてあったのだ。\n\nそのサイトによると、姿勢による疲れ方の違いを調べた結果、ずっと座って仕事をしていた人は、「首から上」と「足のひざから上」が特に疲れていたことがわかったそうだ。ずっと立っていた人は「足のひざから下」はとても疲れていたが、「首から上」はあまり疲れていなかった。体全体があまり疲れていなかったのは立ったり座ったりして姿勢を変えていた人だった。\n\n実際に、ある会社では社員が立ったり座ったりして仕事ができるようにしてみたら、その結果、体の調子が悪いと言う人が減り、そのうえ以前より社員の間でよくコミュニケーションをとるようになったそうだ。立っていると、移動しやすいし、ほかの社員にも話しかけやすい。会議室にも同じ机を置いて、立って議論できるようにしてみたら、意見やアイデアがたくさん出て、会議が早く終わることが多くなった。\n\nお金はかかるかもしれないが、私たちの会社もこのような机にしてほしい。今度、会社に意見を出してみようと思う。',
              items: [
                { text: '面白いサイトから、わかったことはどれか。', options: ['ずっと座っていた人は、足はどこも疲れていなかった','ずっと立っていた人は、体が全体的に疲れていた','どんな姿勢をしていた人も皆、足は全体的に疲れていなかった','立ったり座ったりしていた人は、体全体があまり疲れていなかった。'] },
                { text: 'ある会社で起きた変化として、合っているのはどれか。', options: ['体の調子が悪くなった社員が増えた','社員の間でコミュニケーションが増えた','時間をかけて話し合う会議が増えた','姿勢がよい社員が増えた。'] },
                { text: '私たちの会社もこのような机にしてほしいとあるが、現在「私」の会社ではどのように仕事をしているか。', options: ['立ったり座ったりして仕事をしている','長い時間、立ったままで仕事をしている','ふだんは立って仕事をしていたが、会議は座っている','普段は座って仕事をしているが、会議は立っている。'] },
                { text: 'この文章のテーマは何か。', options: ['机の高さといすの関係','体の調子とお金の関係','姿勢が体や仕事に与える影響','社員の意見が会社にえる影響。'] }
              ]
            }
          ]
        },
        {
          key: 'm4', title: '問題４',
          instruction: '右のページは、大学にはってある国際交流授業のお知らせである。これを読んで、下の質問に答えなさい。答えは、１・２・３・４から最もよいものを一つ選びなさい。',
          clusters: [
            {
              boxed: true,
              passage: '大原経済大学\n「外国人学生のための進学相談会」のご案内\n\n大原経済大学では、外国人学生のための進学相談会を行います。大学の特徴や入試についてお伝えするほか、さまざまなプログラムを用意しています。大原経済大学で学びたい日本語学校の学生さんや、大学進学に興味がある方、ぜひご来場ください。\n\n日時：7月13日（土）10：00〜13：00（9：30受付開始）\n場所：大原経済大学\n予約：不要です。（3-A留学生課による進学相談で予約が必要な場合があります）\n好きなプログラムだけを選んで参加していただくこともできます。\n当日の受付：大学に来たときに、必ず図書館前の受付で名前を書いてください。資料をお渡しします。\n各会場には各プログラムの開始時間までにお入りください。',
              table: {
                headers: ['時間','プログラム','会場'],
                rows: [
                  { time: '10:00〜10:30', program: '1. 大学紹介・入試の説明', venue: '101教室' },
                  { time: '10:45〜11:30', program: '2. 大学の講義紹介\n　2A「経営学入門」（上原光一先生）', venue: '202教室' },
                  { time: '', program: '　2B「アジア経済の今後」（中野安子先生）', venue: '303教室' },
                  { time: '11:40〜12:20', program: '3-A 留学生課による進学相談', venue: '101教室' },
                  { time: '', program: '3-B 先輩留学生による大学紹介', venue: '102教室' },
                  { time: '12:30〜13:30', program: '4. 先輩留学による大学案内', venue: '図書館など' }
                ]
              },
              passageAfterTable: '＊進学相談では、留学生課の人以外に、経済学部の上原先生、中野先生に相談することもできます。当日の申込はできません。先生方への相談を希望される方は、留学生課にメールでご連絡ください。（7月3日締め切り）\n\nその他：駐車場はありません。公共交通機関をご利用ください。\n\nお問い合わせ・連絡先　学生部留学生課　088-165-2426',
              items: [
                { text: 'チュウさんは、プログラムの中の「2.大学の講義紹介」から参加しようと思っている。「2_A.『経営学入門』」の講義が聴きたい場合、どうしなければならないか。', options: ['図書館前の受付で名前を書き、10時までに101教室に入る','図書館前の受付で名前を書き、10時45分までに202教室に入る','図書館前の受付に行く必要はないが、10時45分までに101教室に入る。','図書館前の受付に行く必要はないが、10時45分までに202教室に入る'] },
                { text: 'シンさんは、「3_A.留学生課による進学相談」で、上原先生に相談したいと思っている。シンさんはどのように申し込みをしなければならないか。', options: ['7月3日までに留学生課にメールを送る。','7月3日までに上原先生にメールを送る。','当日、受付で、上原先生への相談を希望することを伝える。','当日、101教室で、上原先生への相談を希望することを伝える。'] }
              ]
            }
          ]
        }
      ]
    }
  ];

  // 公式解答（送付された解答用紙より）
  const ANSWER_KEY = {
    m1_1:2, m1_2:3, m1_3:1, m1_4:4,
    m2_1:4, m2_2:3, m2_3:4, m2_4:3, m2_5:1, m2_6:3,
    m3_1:4, m3_2:2, m3_3:2, m3_4:3,
    m4_1:2, m4_2:1
  };
  const UNCERTAIN_QIDS = new Set();
  const EXCLUDED_QIDS = new Set();

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function renderPromptHtml(text){
    return escapeHtml(text)
      .replace(/\n/g, '<br>')
      .replace(/（\s*）/g, '<span class="blank">（　）</span>')
      .replace(/_{2,}/g, '<span class="blank">＿＿＿</span>')
      .replace(/★/g, '<span class="star">★</span>')
      .replace(/\*\*(.+?)\*\*/g, '<span class="target-word">$1</span>');
  }

  function renderPassageHtml(text){
    return text.split(/\n\n+/).map(function(para){
      let html = escapeHtml(para)
        .replace(/\n/g, '<br>')
        .replace(/［(\d+)］/g, '<span class="pnum">［$1］</span>')
        .replace(/。/g, '。<br>')
        .replace(/(<br>)+$/, '');
      return '<p class="passage-p">' + html + '</p>';
    }).join('');
  }

  function renderTableHtml(table){
    let html = '<div class="table-wrap"><table class="schedule-table"><thead><tr>';
    table.headers.forEach(h => { html += '<th>' + escapeHtml(h) + '</th>'; });
    html += '</tr></thead><tbody>';
    table.rows.forEach(row => {
      html += '<tr>';
      html += '<td>' + (row.time ? escapeHtml(row.time).replace(/\n/g,'<br>') : '') + '</td>';
      html += '<td>' + escapeHtml(row.program).replace(/\n/g,'<br>') + '</td>';
      html += '<td>' + escapeHtml(row.venue).replace(/\n/g,'<br>') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  function flattenMondaiItems(m){
    const list = [];
    let idx = 0;
    const sources = m.clusters
      ? m.clusters.reduce((acc, c) => acc.concat(c.items), [])
      : m.items;
    sources.forEach(item => {
      idx++;
      list.push({ item: item, idx: idx, qid: m.key + '_' + idx });
    });
    return list;
  }

  function renderQuestionHtml(m, entry){
    const item = entry.item, idx = entry.idx, qid = entry.qid;
    const flag = UNCERTAIN_QIDS.has(qid) ? '<span class="uncertain-flag">要確認</span>' : '';
    let html = '<div class="q" data-qid="' + qid + '">';
    html += '  <div class="qnum">' + idx + '</div>';
    html += '  <div class="qbody">';
    html += '    <p class="qtext">' + renderPromptHtml(item.text) + flag + '</p>';
    html += '    <div class="options" role="radiogroup" aria-label="' + escapeHtml(m.title) + '(' + idx + ')">';
    item.options.forEach((opt, i) => {
      html += '<label class="opt">';
      html += '  <input type="radio" name="' + qid + '" value="' + (i + 1) + '" data-text="' + escapeHtml(opt) + '">';
      html += '  <span class="bubble">' + (i + 1) + '</span>';
      html += '  <span class="opt-text">' + escapeHtml(opt) + '</span>';
      html += '</label>';
    });
    html += '    </div>';
    html += '  </div>';
    html += '</div>';
    return html;
  }

  const formEl = document.getElementById('form');
  let totalQuestions = 0;

  TEST_DATA.forEach(part => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = '<h2>' + escapeHtml(part.title) + '</h2>';

    part.mondai.forEach(m => {
      const mEl = document.createElement('div');
      mEl.className = 'mondai';
      let html = '';
      html += '<div class="mondai-head"><div class="mondai-badge">' + m.key.replace('m','') + '</div><div class="mondai-title">' + escapeHtml(m.title) + '</div></div>';
      html += '<p class="mondai-instruction">' + escapeHtml(m.instruction) + '</p>';

      if (m.passage) {
        html += '<div class="passage">' + renderPassageHtml(m.passage) + '</div>';
      }

      if (m.clusters) {
        let idx = 0;
        m.clusters.forEach(cluster => {
          if (cluster.passage) {
            html += '<div class="passage' + (cluster.boxed === false ? ' passage-plain' : '') + '">' + renderPassageHtml(cluster.passage) + '</div>';
          }
          if (cluster.table) {
            html += renderTableHtml(cluster.table);
          }
          if (cluster.passageAfterTable) {
            html += '<div class="passage' + (cluster.boxed === false ? ' passage-plain' : '') + '">' + renderPassageHtml(cluster.passageAfterTable) + '</div>';
          }
          cluster.items.forEach(item => {
            idx++;
            totalQuestions++;
            html += renderQuestionHtml(m, { item: item, idx: idx, qid: m.key + '_' + idx });
          });
        });
      } else {
        flattenMondaiItems(m).forEach(entry => {
          totalQuestions++;
          html += renderQuestionHtml(m, entry);
        });
      }

      mEl.innerHTML = html;
      partEl.appendChild(mEl);
    });

    formEl.appendChild(partEl);
  });

  document.getElementById('targetEmailLabel').textContent = CONFIG.teacherEmail;

  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const unansweredLabel = document.getElementById('unansweredLabel');

  function updateProgress(){
    let answered = 0;
    TEST_DATA.forEach(part => part.mondai.forEach(m => flattenMondaiItems(m).forEach(entry => {
      const qid = entry.qid;
      const checked = formEl.querySelector('input[name="' + qid + '"]:checked');
      const qEl = formEl.querySelector('.q[data-qid="' + qid + '"]');
      if (checked) {
        answered++;
        if (qEl) qEl.classList.add('answered');
      } else if (qEl) {
        qEl.classList.remove('answered');
      }
    })));
    progressFill.style.width = (answered / totalQuestions * 100) + '%';
    progressLabel.textContent = '回答済み: ' + answered + ' / ' + totalQuestions;
    const remaining = totalQuestions - answered;
    unansweredLabel.textContent = remaining > 0 ? ('未回答: ' + remaining + '問') : 'すべて回答済みです';
    unansweredLabel.className = remaining > 0 ? 'unanswered-note' : '';
    return answered;
  }

  formEl.addEventListener('change', updateProgress);
  updateProgress();

  function buildReport(){
    const name = document.getElementById('studentName').value.trim();
    const lines = [];
    lines.push(CONFIG.testName + ' 解答');
    lines.push('お名前: ' + (name || '（未入力）'));
    lines.push('送信日時: ' + new Date().toLocaleString('ja-JP'));
    lines.push('');
    let answered = 0;
    let correct = 0;
    let scoredTotal = 0;
    TEST_DATA.forEach(part => {
      lines.push('■ ' + part.title);
      part.mondai.forEach(m => {
        lines.push('【' + m.title + '】');
        flattenMondaiItems(m).forEach(entry => {
          const qid = entry.qid;
          const checked = formEl.querySelector('input[name="' + qid + '"]:checked');
          const isExcluded = EXCLUDED_QIDS.has(qid);
          const answerKey = ANSWER_KEY[qid];
          if (checked) answered++;

          let mark = '';
          if (isExcluded) {
            mark = '（採点対象外）';
          } else {
            scoredTotal++;
            const isCorrect = checked && parseInt(checked.value, 10) === answerKey;
            if (isCorrect) {
              correct++;
              mark = ' ✓';
            } else {
              mark = ' ✗（正解: ' + answerKey + '）';
            }
          }
          if (UNCERTAIN_QIDS.has(qid)) mark += ' ※要確認';

          lines.push('(' + entry.idx + ') → ' + (checked ? checked.value + '. ' + checked.dataset.text : '未回答') + mark);
        });
        lines.push('');
      });
    });
    lines.push('----');
    lines.push('回答済み: ' + answered + ' / ' + totalQuestions);
    lines.push('得点: ' + correct + ' / ' + scoredTotal + '点');
    return {
      subject: CONFIG.testName + ' 解答 - ' + (name || '無記名') + '（' + correct + '/' + scoredTotal + '点）',
      body: lines.join('\n'),
      answered: answered,
      correct: correct,
      scoredTotal: scoredTotal
    };
  }

  const resultPanel = document.getElementById('resultPanel');
  const scoreNumEl = document.getElementById('scoreNum');
  const scoreTotalEl = document.getElementById('scoreTotal');

  function showResult(report){
    scoreNumEl.textContent = report.correct;
    scoreTotalEl.textContent = report.scoredTotal;
    resultPanel.hidden = false;
    resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  const sendBtn = document.getElementById('sendBtn');
  const sendStatus = document.getElementById('sendStatus');
  const sendBtnDefaultLabel = sendBtn.textContent;
  sendBtn.addEventListener('click', function(){
    const report = buildReport();
    showResult(report);

    sendBtn.disabled = true;
    sendBtn.textContent = '送信中…';
    sendStatus.textContent = '';
    sendStatus.className = 'send-status';

    const studentEmail = document.getElementById('studentEmail').value.trim();
    const payload = {
      _subject: report.subject,
      _captcha: 'false',
      お名前: document.getElementById('studentName').value.trim() || '無記名',
      得点: report.correct + ' / ' + report.scoredTotal + '点',
      解答内容: report.body
    };
    if (studentEmail) payload._replyto = studentEmail;

    fetch('https://formsubmit.co/ajax/' + encodeURIComponent(CONFIG.teacherEmail), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(res){
      if (!res.ok) throw new Error('send failed');
      return res.json();
    }).then(function(){
      sendBtn.textContent = '送信しました ✓';
      sendStatus.textContent = '先生に送信しました。';
      sendStatus.className = 'send-status send-status-ok';
    }).catch(function(){
      sendBtn.disabled = false;
      sendBtn.textContent = sendBtnDefaultLabel;
      sendStatus.textContent = '送信に失敗しました。「解答をコピー」ボタンで代わりに送ってください。';
      sendStatus.className = 'send-status send-status-error';
    });
  });

  const copyBtn = document.getElementById('copyBtn');
  const toast = document.getElementById('toast');
  copyBtn.addEventListener('click', function(){
    const report = buildReport();
    showResult(report);
    const text = '件名: ' + report.subject + '\n\n' + report.body;
    function showToast(){
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showToast).catch(() => {
        window.prompt('以下をコピーしてください:', text);
      });
    } else {
      window.prompt('以下をコピーしてください:', text);
    }
  });
})();
</script>
